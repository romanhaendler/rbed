# The interactive documentation site (site/, ADR-0005) on GitHub Pages: https://romanhaendler.github.io/rbed/
# Built from the rbed sources of the same commit, with its Javadoc at /rbed/api/; deployed on every
# push to main, or by hand. On a pull request it is built and tested, not deployed, so a library
# change the site cannot compile shows up before the merge.
# rbed's own tests run first, then the JUnit, Node parity and browser tests of the site; a failing
# one stops the deployment.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: mvn -B -q verify
        working-directory: .
      - run: npm ci
      - run: npm test
      # npm test has already installed rbed, built its Javadoc and compiled the Scenarios with TeaVM
      - run: npm run build:web
      # the browser itself is cached, keyed on the @playwright/test version of package.json; its
      # system libraries come from apt on every run
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.63.0
      - run: npx playwright install chromium && npx playwright install-deps chromium
      - run: npm run test:browser
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
